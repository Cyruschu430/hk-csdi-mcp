name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the single dependency
        run: pip install "mcp>=2.3"

      - name: Auth, quota and revocation (no network)
        run: python test_auth.py

      - name: Spatial join geometry (no network)
        run: python test_spatial_join.py

      - name: Bounded GeoJSON slice (no network)
        run: python test_slice.py

      - name: ArcGIS FeatureServer resolver (no network)
        run: python test_arcgis_service.py

      - name: Self-test (catalogue harvest, search, XML escape, quota guard)
        run: python hk_csdi_mcp.py --selftest

      - name: MCP stdio protocol test (live CSDI data)
        run: python test_mcp_client.py
